<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d0c0a"/>
      <stop offset="100%" stop-color="#1e1c17"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a88c4f" stop-opacity="0"/>
      <stop offset="50%" stop-color="#a88c4f" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#a88c4f" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#sky)"/>
  <!-- Grid lines -->
  <rect x="0" y="0" width="1200" height="800" fill="none" opacity="0.06">
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M 80 0 L 0 0 0 80" fill="none" stroke="#efede7" stroke-width="0.5"/>
    </pattern>
    <rect width="1200" height="800" fill="url(#grid)"/>
  </rect>
  <!-- Building silhouette -->
  <rect x="320" y="160" width="560" height="500" fill="#12110f" opacity="0.9"/>
  <rect x="340" y="180" width="520" height="460" fill="none" stroke="#a88c4f" stroke-width="1" opacity="0.4"/>
  <!-- Windows -->
  <rect x="380" y="220" width="80" height="100" fill="#2a2820" stroke="#a88c4f" stroke-width="0.5" opacity="0.8"/>
  <rect x="480" y="220" width="80" height="100" fill="#2a2820" stroke="#a88c4f" stroke-width="0.5" opacity="0.8"/>
  <rect x="640" y="220" width="80" height="100" fill="#3d3a30" stroke="#a88c4f" stroke-width="0.5" opacity="0.9"/>
  <rect x="740" y="220" width="80" height="100" fill="#2a2820" stroke="#a88c4f" stroke-width="0.5" opacity="0.8"/>
  <!-- Warm window light -->
  <rect x="640" y="220" width="80" height="100" fill="#a88c4f" opacity="0.08"/>
  <!-- Door -->
  <rect x="540" y="480" width="120" height="180" fill="#1a1915" stroke="#a88c4f" stroke-width="0.8" opacity="0.9"/>
  <!-- Horizontal accent -->
  <rect x="0" y="380" width="1200" height="1" fill="url(#glow)"/>
  <!-- Ground reflection -->
  <rect x="0" y="660" width="1200" height="140" fill="#0a0908" opacity="0.7"/>
  <!-- Coffee cup silhouette -->
  <path d="M560 560 Q560 550 580 550 L620 550 Q640 550 640 560 L650 590 Q650 600 600 600 Q550 600 550 590 Z" fill="#a88c4f" opacity="0.3"/>
</svg>
